# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings for VGraph. AGENTS.md (via CLAUDE.md) is picked up as
# review guidelines automatically; the instructions below add what matters per path.
language: en-US

reviews:
  profile: chill
  auto_approvals:
    enabled: false   # single maintainer; checks stay advisory
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  related_prs: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  # Generated, vendored or binary files. Nothing in them is reviewable by reading.
  path_filters:
    - "!Tests/VGraphSVGTests/__Snapshots__/**"   # recorded renderer output
    - "!VGraphWasm/Sources/Generated/**"         # BridgeJS output
    - "!website/dist/**"                         # built engine bundle
    - "!**/Package.resolved"
    - "!**/package-lock.json"
    - "!fonts/**"
    - "!graphics/**"
    - "!**/*.{jpg,png,ttf,wasm,vithanco}"
    - "!docs/**/*.svg"

  path_instructions:
    - path: "{Sources/VGraph,Sources/VGLanguage,Sources/VGraphSVG,Sources/VGraphvizLib,Sources/App,Sources/EditorCore,Sources/MathUtils}/**/*.swift"
      instructions: |
        These targets compile into the wasm module under Embedded Swift (AGENTS.md lists
        the rules). Flag key paths, a generic function called on an `any` value,
        reflection such as "\(self)" on enums or "\(type(of:))", and any Foundation use.
        Ports are generic parameters, never `any ForSomething`; a core `VFor...` port
        needs its re-export in every hexagon that speaks it. Concrete adapters may be
        named only in Sources/App/Composition, never under a Domain folder.
        Errors are typed throws with `VError`. Prefer immutable values and pure functions.
    - path: "Sources/VGraphvizLib/**/*.swift"
      instructions: |
        The only consumer of SwiftGraphviz. GVGraph/GVNode/GVEdge are raw C pointers
        into a global, non-thread-safe Graphviz context: check for use after
        `gvFreeLayout`/`agclose`, reading layout data when `gvLayout` failed, and C
        strings that die before Graphviz copies them. Graphviz uses 72 points per inch
        and returns node sizes in inches; flag mixed-up units.
    - path: "{Sources/VGraphMCP,Sources/VGraphMCPHTTP,Sources/VGraphMCPHTTPKit,Sources/VGraphMCPTools}/**/*.swift"
      instructions: |
        The hosted MCP endpoint is open to anyone (SECURITY.md, docs/mcp-hardening.md).
        Layout cannot be cancelled, so every input must be bounded before layout through
        `MCPLimits`. Flag a new tool or parameter that reaches layout or PNG conversion
        without a limit, unbounded subprocess output or runtime, and error messages that
        leak paths or internals. Foundation and key paths are fine here.
    - path: "VGraphWasm/**/*.swift"
      instructions: |
        Embedded Swift rules apply. `@JS public func` in VGraphWasm/Sources/Main.swift is
        the API the Obsidian and VS Code plugins and vgraph-mcp-node call; a removed or
        renamed export breaks them silently (scripts/check-plugin-api.sh). DOM code stays
        in VGraphEditor; decisions belong in EditorCore so they can be tested natively.
    - path: "Tests/**/*.swift"
      instructions: |
        Tests come before the fix or feature, so a bug-fix PR should add a test that
        fails without it. Prefer asserting on real output (SVG, layout values) over
        "does not crash". A changed snapshot under __Snapshots__ needs a reason in the PR.
    - path: "{VGraphWasm/Tests-JS,VGraphWasm/Tests-Browser,vgraph-mcp-node}/**/*.{js,mjs}"
      instructions: |
        Browser tests run in Chromium and WebKit (the iPad project); flag waits on fixed
        timeouts instead of conditions. vgraph-mcp-node hosts the wasm engine and must
        call only exports that Main.swift still declares.
    - path: "{**/*.sh,justfile}"
      instructions: |
        Shell is written for the maintainer's macOS (bash 3.2, BSD tools) and must also
        run in the Linux CI container. Flag bash 4+ features (associative arrays,
        `mapfile`, `${x,,}`), GNU-only or BSD-only flags (sed -i, readlink -f, date,
        stat), unquoted variables and missing error handling. No personal or
        machine-specific absolute paths. A check that prints a warning and exits 0 is a
        check that never fails; flag it.
    - path: ".github/workflows/**"
      instructions: |
        Public repository. Actions are pinned to a full commit SHA, `permissions` stay
        minimal, every download is verified by checksum, and `pull_request_target` is
        never used. Nothing is published from CI; releases stay on the maintainer's
        machine, so no publish secret may appear here.
    - path: "{Dockerfile,deploy.sh,.dockerignore,.gcloudignore}"
      instructions: |
        The image serves the public MCP endpoint on Cloud Run. It runs as a non-root
        user; flag anything that adds secrets to the image, widens what gets copied in,
        or unpins a base image or download.
    - path: "{CONTEXT.md,docs/adr/**}"
      instructions: |
        CONTEXT.md is the glossary; a new term should not duplicate one listed under
        Avoid. An ADR states the decision as it stands now; ADR numbers are never reused.

  pre_merge_checks:
    docstrings:
      mode: "off"   # docs explain why, in /docs; a coverage gate would push the opposite
    title:
      mode: warning
    description:
      mode: warning
    custom_checks:
      - name: "SwiftGraphviz compatibility"
        mode: warning
        instructions: |
          VGraph depends on Vithanco/SwiftGraphviz with `.upToNextMinor` in Package.swift,
          resolved in both Package.resolved and VGraphWasm/Package.resolved. Fail if the
          PR changes the SwiftGraphviz requirement or the resolved version/revision in
          only one of those places, or if the two resolved files then disagree. Fail if
          code under Sources/VGraphvizLib uses a SwiftGraphviz or GraphvizBridge symbol
          that the required version does not provide (check the linked repository), or
          if the PR raises the requirement without saying why in its description.
          Pass as not applicable if none of these files or that directory changed.
      - name: "Wasm engine export break disclosure"
        mode: warning
        instructions: |
          Fail if a `@JS public func` in VGraphWasm/Sources/Main.swift is removed or
          renamed, or its parameters or return type change, and the PR description does
          not name the affected consumers (obsidian-vithanco, vscode-vithanco,
          vgraph-mcp-node) and say how they are updated. Additions do not count.
      - name: "ADR conflicts are explicit"
        mode: warning
        instructions: |
          Fail if the change reverses or contradicts a decision recorded in docs/adr/
          and neither the PR description nor an ADR edit in the PR says so. Otherwise pass.

knowledge_base:
  learnings:
    scope: local
  linked_repositories:
    - repository: "Vithanco/SwiftGraphviz"
      instructions: |
        Swift wrapper around the Graphviz C library, used only by Sources/VGraphvizLib.
        Its public API is in Sources/SwiftGraphviz and Sources/GraphvizBridge. Use it to
        check that VGraph calls only API that exists in the SwiftGraphviz version it
        requires, and to spot behaviour changes (units, defaults) after a version bump.
