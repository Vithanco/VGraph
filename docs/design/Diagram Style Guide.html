<title>Vithanco — Diagram Style Guide</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #18160f;
    --ink-2: #5a564e;
    --ink-3: #9a9690;
    --rule: #e8e3db;
    --page: #faf9f6;
    --card: #ffffff;
    --preview-bg: #f5f4f0;
    --edge: #b0a898;
    --edge-bold: #5a564e;
    --code-bg: #f0ede8;
    --note-bg: #f0f4ff;
    --note-border: #c8d4f0;
    --note-text: #203070;
    --group-fill: #f4f3f0;
    --group-text: #505048;
    --pill-bg: #eeece8;
    --pill-text: #807870;
    --junctor: #303030;
    --badge-icon: #ffffff;
    --accent: #2258c8;
    --font: 'DM Sans', system-ui, sans-serif;
    --mono: 'DM Mono', monospace;
  }
  [data-theme="dark"] {
    --ink: #ecebe5;
    --ink-2: #a8a49a;
    --ink-3: #6e6a62;
    --rule: #2a2824;
    --page: #0e0d0a;
    --card: #181612;
    --preview-bg: #1c1a16;
    --edge: #6e6a60;
    --edge-bold: #a8a49a;
    --code-bg: #26241f;
    --note-bg: #14182a;
    --note-border: #2a3258;
    --note-text: #b8c4e8;
    --group-fill: #1c1a16;
    --group-text: #c8c4bc;
    --pill-bg: #262420;
    --pill-text: #a8a49a;
    --junctor: #e8e3db;
    --badge-icon: #14120f;
  }
  html { font-size: 15px; }
  body {
    font-family: var(--font);
    background: var(--page);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background 0.25s ease, color 0.25s ease;
  }

  /* Layout */
  .page { max-width: 960px; margin: 0 auto; padding: 64px 40px 120px; }

  /* Header */
  .doc-header { margin-bottom: 64px; border-bottom: 1px solid var(--rule); padding-bottom: 40px; }
  .doc-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; }
  .doc-title { font-size: 36px; font-weight: 300; letter-spacing: -0.5px; color: var(--ink); line-height: 1.2; margin-bottom: 16px; }
  .doc-title strong { font-weight: 600; }
  .doc-lead { font-size: 15px; color: var(--ink-2); max-width: 580px; line-height: 1.7; }

  /* Section */
  .section { margin-bottom: 72px; }
  .section-label { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .section-title { font-size: 22px; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 8px; }
  .section-body { font-size: 14px; color: var(--ink-2); margin-bottom: 32px; line-height: 1.7; max-width: 620px; }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
  .card-pad { padding: 32px; }

  /* Grid */
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }


  /* Palette grid */
  .palette-row { display: flex; gap: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--rule); margin-bottom: 16px; }
  .swatch {
    flex: 1; padding: 18px 14px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .swatch-name { font-size: 11px; font-weight: 600; color: var(--ink); }
  .swatch-hex { font-size: 10px; font-family: var(--mono); color: var(--ink-2); }

  /* Spec table */
  .spec-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .spec-table th { text-align: left; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); padding: 0 12px 10px; border-bottom: 1px solid var(--rule); }
  .spec-table td { padding: 11px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .spec-table td:first-child { font-weight: 500; color: var(--ink); width: 200px; }
  .spec-table td:last-child { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .spec-table tr:last-child td { border-bottom: none; }

  /* Type label */
  .tl { display: inline-block; font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }

  /* Note box */
  .note { background: var(--note-bg); border: 1px solid var(--note-border); border-radius: 8px; padding: 14px 18px; font-size: 13px; color: var(--note-text); line-height: 1.6; margin-top: 20px; }
  .note strong { font-weight: 600; }

  /* Divider */
  hr { border: none; border-top: 1px solid var(--rule); margin: 48px 0; }

  /* Inline code */
  code { font-family: var(--mono); font-size: 12px; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; color: var(--ink); }

  /* Color type headers */
  .palette-section-title { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 10px; margin-top: 28px; }
  .palette-section-title:first-child { margin-top: 0; }

  /* Mini diagram container */
  .diagram-preview { background: var(--preview-bg); border-radius: 10px; padding: 24px; display: flex; justify-content: center; }

  @media print {
    body { background: white; }
  }
</style>
</head>

// ─── Theme: light/dark color derivation ─────────────────────────────────────

function hexToHSL(hex) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.slice(0,2),16)/255;
  const g = parseInt(hex.slice(2,4),16)/255;
  const b = parseInt(hex.slice(4,6),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if (max===min) { h = 0; s = 0; }
  else {
    const d = max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h = (g-b)/d + (g<b ? 6 : 0); break;
      case g: h = (b-r)/d + 2; break;
      case b: h = (r-g)/d + 4; break;
    }
    h *= 60;
  }
  return [h, s*100, l*100];
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const c = (1-Math.abs(2*l-1))*s;
  const x = c*(1-Math.abs(((h/60)%2)-1));
  const m = l-c/2;
  let r=0,g=0,b=0;
  if (h<60){r=c;g=x;}
  else if (h<120){r=x;g=c;}
  else if (h<180){g=c;b=x;}
  else if (h<240){g=x;b=c;}
  else if (h<300){r=x;b=c;}
  else {r=c;b=x;}
  const to = v => Math.round((v+m)*255).toString(16).padStart(2,'0');
  return ('#' + to(r) + to(g) + to(b)).toLowerCase();
}

// Derive a dark variant of a single hex by classifying its lightness:
//   light tints (>70% L)  → very dark, slightly desaturated (node fills)
//   mid hues   (30–70% L) → bright, saturated (borders / accents)
//   dark tones (<30% L)   → light pastel (text on dark fills)
//   near-grays (<8% S)    → invert lightness, keep neutral
function darkOf(hex) {
  const [h, s, l] = hexToHSL(hex);
  if (s < 8) {
    // neutral gray — mirror lightness
    const nl = Math.max(0, Math.min(100, 100 - l));
    return hslToHex(h, s, nl);
  }
  if (l > 70) return hslToHex(h, Math.min(s, 32), 13);  // dark fill
  if (l < 30) return hslToHex(h, Math.min(s, 60), 86);  // light text
  // mid → brighter accent
  return hslToHex(h, Math.min(s + 8, 78), Math.max(l, 62));
}

// Chrome hexes that appear inside SVG attributes (fill="..." / stroke="...").
// CSS variable substitution would require touching every JSX site; attribute
// selectors let us remap them per theme without changing the JSX at all.
const CHROME_DARK = {
  '#b0a898': '#6e6a60',  // edges
  '#5a564e': '#a8a49a',  // ink-2 AND edge-bold (aliases — same hex in both modes by rule)
  '#9a9690': '#6e6a62',  // ink-3
  '#1a1816': '#ecebe5',  // ink headings inside svgs
  // '#303030' handled via the --junctor CSS var; do not remap it as an attribute
  // selector (a junctor icon would lose contrast).
  '#eeece8': '#262420',  // pill bg
  '#807870': '#a8a49a',  // pill text
  '#f4f3f0': '#1c1a16',  // group fill
  '#909088': '#7a766e',  // group border
  '#505048': '#c8c4bc',  // group text
  '#efefef': '#22201c',  // group nested fill
  '#e8e7e4': '#1a1814',  // group stack
  '#eeedea': '#1f1d19',
  '#808078': '#a8a49a',  // CLD loop indicator
};

// Build complete light→dark hex map: chrome + every type's fill/border/text.
const DARK_MAP = (() => {
  const m = {...CHROME_DARK};
  for (const t of ALL_TYPES) {
    if (t.fill   && !m[t.fill])   m[t.fill]   = darkOf(t.fill);
    if (t.border && !m[t.border]) m[t.border] = darkOf(t.border);
    if (t.text   && !m[t.text])   m[t.text]   = darkOf(t.text);
  }
  // white stays white; the icon on a coloured circle follows --badge-icon instead
  delete m['#fff']; delete m['#ffffff'];
  return m;
})();

// Emit attribute-selector overrides scoped to [data-theme="dark"].
// Attribute selectors have higher specificity than SVG presentation attributes,
// so no !important is needed for fill="..." / stroke="...".
function DarkOverrides() {
  const css = useMemo(() => {
    let s = '';
    for (const [light, dark] of Object.entries(DARK_MAP)) {
      s += `[data-theme="dark"] [fill="${light}"]{fill:${dark};}`;
      s += `[data-theme="dark"] [stroke="${light}"]{stroke:${dark};}`;
    }
    return s;
  }, []);
  return <style dangerouslySetInnerHTML={{__html: css}}/>;
}

// Resolve type → palette in the current theme. Used by components whose colors
// live in JSX inline styles (not SVG attrs), where attribute selectors don't apply.
function useTypeColors(type, theme) {
  return useMemo(() => {
    if (theme !== 'dark') return { fill: type.fill, border: type.border, text: type.text };
    return {
      fill:   DARK_MAP[type.fill]   || darkOf(type.fill),
      border: DARK_MAP[type.border] || darkOf(type.border),
      text:   DARK_MAP[type.text]   || darkOf(type.text),
    };
  }, [type, theme]);
}

const ThemeContext = React.createContext('light');
const useTheme = () => React.useContext(ThemeContext);

// ─── Theme toggle button ─────────────────────────────────────────────────────

function ThemeToggle({ theme, setTheme }) {
  const isDark = theme === 'dark';
  return (
    <button
      onClick={() => setTheme(isDark ? 'light' : 'dark')}
      aria-label="Toggle dark mode"
      style={{
        position:'fixed', top:20, right:20, zIndex:100,
        display:'flex', alignItems:'center', gap:10,
        padding:'8px 14px 8px 10px',
        background:'var(--card)', color:'var(--ink)',
        border:'1px solid var(--rule)', borderRadius:999,
        font:'500 12px var(--font)', letterSpacing:'0.02em',
        cursor:'pointer',
        boxShadow:'0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04)',
        transition:'background 0.2s, color 0.2s, border-color 0.2s',
      }}>
      <span style={{
        width:22, height:22, borderRadius:11,
        background: isDark ? '#f0ede5' : '#1a1816',
        display:'flex', alignItems:'center', justifyContent:'center',
        fontSize:12, lineHeight:1,
      }}>
        {isDark ? '☾' : '☀'}
      </span>
      <span>{isDark ? 'Dark' : 'Light'}</span>
    </button>
  );
}

const NODE_W = 172, NODE_H = 60, NR = 9;
const CONTENT = 'There is a pressure\nto reduce prices.';

function NodeAccent({ type, x = 0, y = 0 }) {
  const lines = CONTENT.split('\n');
  return (
    <g transform={`translate(${x},${y})`}>
      {/* Shadow */}
      <rect x={1} y={2} width={NODE_W} height={NODE_H} rx={NR} fill="rgba(0,0,0,0.05)" style={{filter:'blur(4px)'}} />
      {/* Body */}
      <rect x={0} y={0} width={NODE_W} height={NODE_H} rx={NR} fill={type.fill} stroke={type.border} strokeWidth={1} />
      {/* Left accent bar */}
      <rect x={0} y={0} width={4} height={NODE_H} rx={NR} fill={type.border} />
      <rect x={0} y={NR} width={4} height={NODE_H - NR} fill={type.border} />
      {/* Icon circle */}
      <circle cx={22} cy={17} r={8} fill={type.border} />
      <Icon name={ARTWORK_OF[type.icon]} x={22-6.25} y={17-6.25} size={12.5} fill="var(--badge-icon)"/>
      {/* Type label */}
      <text x={34} y={20} fontFamily="'DM Sans',sans-serif" fontSize={9} fontWeight="600"
        fill={type.border} opacity={0.85}
        style={{textTransform:'uppercase',letterSpacing:'0.07em'}}>
        {type.abbr || type.name}
      </text>
      {/* Content */}
      {lines.map((l, i) => (
        <text key={i} x={16} y={36 + i * 16}
          fontFamily="'DM Sans',sans-serif" fontSize={12.5} fontWeight={500} fill={type.text}>
          {l}
        </text>
      ))}
    </g>
  );
}

// ─── CLD Loop Indicators ─────────────────────────────────────────────────────

function LoopIndicator({ type = 'R', clockwise = true, x = 0, y = 0, size = 52 }) {
  const r = size * 0.43;
  const cx = x + size / 2, cy = y + size / 2;
  const sw = size * 0.055;
  const color = '#808078';
  const toRad = d => d * Math.PI / 180;
  const toDeg = v => v * 180 / Math.PI;
  const pt = deg => [cx + r * Math.cos(toRad(deg)), cy + r * Math.sin(toRad(deg))];

  // 240° arc ending at 12 o'clock (270° SVG) — arrowhead at top pointing right (CW) or left (CCW).
  // CW:  starts at  30° (4:30), sweeps CW  240° to 270° (12 o'clock)
  // CCW: starts at 150° (7:30), sweeps CCW 240° to 270° (12 o'clock)
  const arcStartDeg = clockwise ? 30 : 150;
  const arcEndDeg   = 270;
  const sweepFlag   = clockwise ? 1 : 0;

  const [sx, sy] = pt(arcStartDeg);
  const [ex, ey] = pt(arcEndDeg);

  // Tangent at 270° (top): CW → pointing right (1,0); CCW → pointing left (−1,0)
  const tx = clockwise ? 1 : -1;
  const ty = 0;

  // SVG rotate(φ) maps (0,1) → (−sinφ, cosφ). Need that = (tx,ty) → φ = atan2(−tx, ty)
  const arrowRot = toDeg(Math.atan2(-tx, ty));

  const ah = sw * 4.2, aw = sw * 3.2;
  const arrowPath = `M 0,0 L ${-aw/2},${-ah} L ${aw/2},${-ah} Z`;

  return (
    <g>
      <path d={`M ${sx},${sy} A ${r},${r} 0 1,${sweepFlag} ${ex},${ey}`}
        fill="none" stroke={color} strokeWidth={sw} strokeLinecap="round"/>
      <g transform={`translate(${ex + tx * ah},${ey + ty * ah}) rotate(${arrowRot})`}>
        <path d={arrowPath} fill={color}/>
      </g>
      <text x={cx} y={cy + size * 0.16} textAnchor="middle"
        fontFamily="'DM Sans',sans-serif" fontSize={size * 0.44} fontWeight={800} fill={color}>
        {type}
      </text>
    </g>
  );
}

// ─── Vithanco watermark ─────────────────────────────────────────────────────

// V-mark-only SVG content (V + accent triangle, no wordmark) — extracted
// from the original logo and inlined via assets/vithanco-mark-svg.js.
const MARK_SVG = (typeof window !== 'undefined' && window.__VITHANCO_MARK_SVG) || '';

// Watermark wordmark spec — real <text>, matches the v2 type system.
const WORDMARK_FONT   = "'DM Sans', system-ui, sans-serif";
const WORDMARK_TEXT   = 'vithanco';
const WORDMARK_WEIGHT = 700;
const WORDMARK_TRACK  = '-0.015em';

// V mark bbox inside the original 253.57 × 193.94 SVG coordinate space.
// Determined from the path geometry — the V mark sits in the upper portion.
// We render the full original SVG and rely on `preserveAspectRatio` + a
// tight viewBox cropping just the mark.
const MARK_VIEWBOX = '88 0 116 130';  // x, y, w, h — covers all three V triangles
const MARK_RATIO   = 116 / 130;       // ≈ 0.89 — slightly taller than wide

// ─── V mark — just the triangles ────────────────────────────────────────────

function VithancoMark({ size = 48, color = 'currentColor', opacity = 1 }) {
  return (
    <svg
      role="img" aria-label="Vithanco mark"
      width={size * MARK_RATIO} height={size}
      viewBox={MARK_VIEWBOX}
      style={{display:'block', color, opacity, overflow:'visible'}}
      dangerouslySetInnerHTML={{__html: MARK_SVG}}
    />
  );
}

// ─── Lockup — V mark + "vithanco" text, roughly square ─────────────────────

// Layout (in a 100×100 unit grid):
//   mark sits centered at top, height ≈ 62 units
//   wordmark sits below at y≈82, font size ≈ 18 units
function VithancoLockup({ size = 64, color = 'currentColor', opacity = 1, compact = false }) {
  if (compact) {
    return <VithancoMark size={size} color={color} opacity={opacity}/>;
  }
  // Combined SVG so the V mark and the <text> scale together perfectly.
  // viewBox is 100×100 → "roughly square" lockup.
  const markH = 62;
  const markW = markH * MARK_RATIO;            // ≈ 55.3
  const markX = (100 - markW) / 2;             // center horizontally
  const markY = 0;
  return (
    <svg
      role="img" aria-label="Vithanco"
      width={size} height={size}
      viewBox="0 0 100 100"
      style={{display:'block', color, opacity, overflow:'visible'}}>
      {/* V mark — nested SVG so its inner viewBox crops to the triangles */}
      <svg x={markX} y={markY} width={markW} height={markH}
        viewBox={MARK_VIEWBOX} preserveAspectRatio="xMidYMid meet"
        overflow="visible"
        dangerouslySetInnerHTML={{__html: MARK_SVG}}/>
      {/* Wordmark — real <text>, DM Sans 700 */}
      <text
        x={50} y={94}
        textAnchor="middle"
        fontFamily={WORDMARK_FONT}
        fontSize={18}
        fontWeight={WORDMARK_WEIGHT}
        letterSpacing={WORDMARK_TRACK}
        fill="currentColor">
        {WORDMARK_TEXT}
      </text>
    </svg>
  );
}

// ─── Auto-corner placement ──────────────────────────────────────────────────

// Pick the corner with the least node-overlap. Returns {x, y, name}.
function pickWatermarkCorner({ canvasW, canvasH, wmW, wmH, nodes = [], padding = 12 }) {
  const corners = [
    { name: 'tl', x: padding,                   y: padding },
    { name: 'tr', x: canvasW - wmW - padding,   y: padding },
    { name: 'bl', x: padding,                   y: canvasH - wmH - padding },
    { name: 'br', x: canvasW - wmW - padding,   y: canvasH - wmH - padding },
  ];
  let best = corners[3], bestScore = Infinity;
  for (const c of corners) {
    const wx2 = c.x + wmW, wy2 = c.y + wmH;
    let overlap = 0;
    for (const n of nodes) {
      const ix = Math.max(0, Math.min(wx2, n.x + n.w) - Math.max(c.x, n.x));
      const iy = Math.max(0, Math.min(wy2, n.y + n.h) - Math.max(c.y, n.y));
      overlap += ix * iy;
    }
    // Slight bias toward bottom-right (the conventional choice) on ties.
    const bias = (c.name === 'br' ? -1 : c.name === 'bl' ? -0.5 : 0);
    const score = overlap + bias;
    if (score < bestScore) { bestScore = score; best = c; }
  }
  return best;
}

// ─── DiagramWatermark — drop-in for diagram canvases ───────────────────────

function DiagramWatermark({ canvasW, canvasH, nodes = [], color = 'currentColor', opacity = 1 }) {
  // Size: max 15% of the smaller canvas dimension. Clamped to [28, 96].
  const target = Math.min(canvasW, canvasH) * 0.15;
  const size = Math.max(28, Math.min(96, target));
  // Compact (mark-only) when canvas width is < 400 — wordmark would be illegible.
  const compact = canvasW < 400;
  const ratio = compact ? MARK_RATIO : 1;
  const wmW = size * ratio;
  const wmH = size;
  const corner = pickWatermarkCorner({ canvasW, canvasH, wmW, wmH, nodes });
  return (
    <g transform={`translate(${corner.x}, ${corner.y})`} style={{color}}>
      <foreignObject width={wmW} height={wmH} style={{overflow:'visible'}}>
        <VithancoLockup size={size} color={color} opacity={opacity} compact={compact}/>
      </foreignObject>
    </g>
  );
}

function s2color(theme, role) {
  if (theme === 'dark') return role === 'label' ? '#6e6a62' : '#a8a49a';
  return role === 'label' ? '#9a9690' : '#5a564e';
}

// Render a forced-theme container — does NOT change document theme, just
// applies the local data-theme so DarkOverrides (scoped by attr selector)
// applies inside this subtree.
function ForcedThemeFrame({ theme, children }) {
  const bg = theme === 'dark' ? '#1c1a16' : '#f5f4f0';
  return (
    <div data-theme={theme} style={{
      background:bg, borderRadius:10, padding:18,
      border: theme==='dark' ? '1px solid #2a2824' : '1px solid var(--rule)',
    }}>
      {children}
    </div>
  );
}

function NodeStrip({ types, forceTheme }) {
  const W = 110, H = 44;
  const gap = 8;
  const totalW = types.length * (W + gap) - gap;
  return (
    <svg width={totalW} height={H + 4} style={{display:'block',overflow:'visible'}}>
      {types.map((t, i) => (
        <MiniThemedNode key={t.name} type={t} x={i*(W+gap)} y={2} w={W} h={H} forceTheme={forceTheme}/>
      ))}
    </svg>
  );
}

function MiniThemedNode({ type, x, y, w, h, forceTheme }) {
  const c = useTypeColors(type, forceTheme);
  // Use style instead of fill/stroke attributes so attribute-selector
  // overrides (scoped to ancestor data-theme) don't double-remap.
  const fillS   = { fill:   c.fill };
  const borderS = { fill:   c.border };
  const strokeS = { stroke: c.border, fill: c.fill };
  const textS   = { fill:   c.text };
  return (
    <g transform={`translate(${x},${y})`}>
      <rect width={w} height={h} rx={7} strokeWidth={1} style={strokeS}/>
      <rect width={3} height={h} rx={7} style={borderS}/>
      <rect y={7} width={3} height={h-7} style={borderS}/>
      <circle cx={18} cy={14} r={7} style={borderS}/>
      <Icon name={ARTWORK_OF[type.icon]} x={18-5.45} y={14-5.45} size={10.9} fill="var(--badge-icon)"/>
      <text x={30} y={17.5} fontFamily="'DM Sans',sans-serif" fontSize={7.5}
        fontWeight={600} style={{fill: c.border, textTransform:'uppercase', letterSpacing:'0.06em'}}>
        {(type.abbr || type.name).slice(0, 14)}
      </text>
      <text x={10} y={34} fontFamily="'DM Sans',sans-serif" fontSize={10}
        fontWeight={500} style={textS}>
        Sample text
      </text>
    </g>
  );
}

          <div style={{fontSize:12, fontWeight:600, color:'var(--ink)', marginBottom:12}}>Specification</div>
          <table className="spec-table">
            <tbody>
              <tr><td>Icon</td><td>A named drawing VGraph ships: one outline, one colour, chosen at the point of use</td></tr>
              <tr><td>Own background</td><td>The junctors (AND, OR, conflict) and the default icon carry their own icon background and are drawn as the whole node</td></tr>
              <tr><td>In a node type badge</td><td>All other icons are drawn alone, in <code>--badge-icon</code>, on the badge's icon background</td></tr>
              <tr><td>Node type badge</td><td>An icon on a coloured icon background at a content node's top-left, then its type name</td></tr>
              <tr><td>Grid</td><td>24 × 24 units · <code>viewBox 0 0 24 24</code></td></tr>
              <tr><td>Paint</td><td>One filled path, no strokes; the point of use gives the colour</td></tr>
              <tr><td>Cut-outs</td><td>Wound against the outer contour (non-zero rule); no contour overlaps another, so letters are merged into one outline first</td></tr>
              <tr><td>Letters</td><td>DM Sans Bold outlines (OFL)</td></tr>
              <tr><td>Line weight</td><td>3.2 units with flat ends, matching DM Sans Bold beside the type label</td></tr>
              <tr><td>Smallest feature</td><td>1px at the size drawn</td></tr>
              <tr><td>Junctor size</td><td>28px, as a junctor (§06)</td></tr>
              <tr><td>Badge icon box</td><td>14px, centred in the 18px icon background</td></tr>
              <tr><td>Names</td><td>Say what the icon means, not what it shows; several names may share one drawing</td></tr>
            </tbody>
          </table>
          <table className="spec-table" style={{marginTop:16}}>
            <thead><tr><th>Artwork</th><th>Kind</th><th>Icon names</th></tr></thead>
            <tbody>
              {Object.entries(ICONS).map(([key, icon]) => (
                <tr key={key}><td><code>{key}</code></td><td>{icon.kind}</td><td>{icon.names.join(', ')}</td></tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

        <p className="section-body">
          Edges are intentionally lightweight — thinner than node borders, in a neutral gray.
          This keeps the graph structure visible without competing with node content.
          Labels sit 6px above the midpoint of the edge line.
        </p>
        <EdgeSpec />

        <p className="section-body">
          Junctors are structural connectors, not content nodes — they should be visually much smaller
          than regular nodes and immediately recognisable as logical operators.
          The words AND / OR are used rather than formal logic symbols for clarity with any audience.
          They are drawn as marks, not set as text, so every renderer shows the same letters.
        </p>
        <JunctorSpec />
      </section>

      <hr />

      {/* 07 — Ghost node */}
      <section className="section">
        <div className="section-label">07</div>
        <h2 className="section-title">Ghost / Edge-Label Node</h2>
        <p className="section-body">
          In concept maps, relationship phrases are represented as nodes rather than inline edge labels.
          This allows relationships to be reused and connected to multiple edges.
          Option C (ghost pill) is recommended: subtle enough to recede, distinct enough to be selectable.
        </p>
        <GhostNodeSpec />
      </section>

      <hr />

      {/* 08 — Groups */}

        <p className="section-body">

          flat gray fill) is too heavy — it competes with node content. The redesigned group uses
          a dashed border and near-white fill so it recedes behind its children.
          Folded groups collapse to a single node with a stacked-shadow effect implying depth.
        </p>
        <GroupSpec />
      </section>

      <hr />

      {/* 09 — Annotation */}
      <section className="section">

        <p className="section-body">

      <hr />

      {/* 09b — CLD Loop Indicators */}
      <section className="section">

        <h2 className="section-title">CLD Loop Indicators</h2>
        <p className="section-body">
          Causal Loop Diagrams use floating loop indicators to label feedback loops.
          Two loop types × two rotation directions give four variants. The indicator is
          diagram furniture — it floats inside the loop it labels and must not compete
          with node colors.
        </p>
        <CLDLoopSpec />
      </section>

      <hr />

      {/* 10 — Implementation */}
      <section className="section">
        <div className="section-label">10</div>
        <h2 className="section-title">Implementation Notes</h2>
        <p className="section-body">
          Since layout is handled by Graphviz and rendering is custom, the two concerns are cleanly separated.
        </p>
        <div className="card card-pad">
          <table className="spec-table">
            <thead><tr><th>Concern</th><th>Handled by</th><th>Notes</th></tr></thead>
            <tbody>
              <tr>
                <td>Node position &amp; size</td>
                <td>Graphviz</td>
                <td>Set <code>shape=rect</code>, <code>width</code>/<code>height</code> in inches. Graphviz returns center coords.</td>
              </tr>
              <tr>
                <td>Edge routing</td>
                <td>Graphviz</td>
                <td>Use <code>splines=ortho</code> or <code>splines=curved</code>. Parse the B-spline control points from the DOT output.</td>
              </tr>
              <tr>
                <td>Node fill, border, radius</td>
                <td>Custom renderer</td>
                <td>Draw rounded rect at Graphviz-supplied position. Ignore Graphviz's own <code>fillcolor</code>.</td>
              </tr>
              <tr>
                <td>Type indicator (A/B/C)</td>
                <td>Custom renderer</td>
                <td>Draw after main rect; use node's <code>type</code> attribute to look up color entry.</td>
              </tr>
              <tr>
                <td>Arrowheads</td>
                <td>Custom renderer</td>
                <td>Set <code>arrowhead=none</code> in Graphviz. Draw custom marker at the end of each parsed spline.</td>
              </tr>
              <tr>
                <td>Edge labels</td>
                <td>Graphviz + custom</td>
                <td>Graphviz supplies label position (<code>lp</code>). Render text at that point with custom font.</td>
              </tr>
              <tr>
                <td>Drop shadows</td>
                <td>Custom renderer</td>
                <td>Draw a blurred rect 2px below/right, then draw main node on top.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div className="note">
          <strong>AND nodes:</strong> the 28px <code>and</code> icon (§06), never a full rect.
          This visually distinguishes logical connectors from content nodes and avoids the wasted whitespace
          of a near-empty rounded rectangle.
        </div>
      </section>

      <hr />

      {/* 11 — Dark Mode */}
      <section className="section">
        <div className="section-label">11</div>
        <h2 className="section-title">Dark Mode</h2>
        <p className="section-body">
          The system carries a parallel dark palette. Each light fill / border / text
          triple maps to a dark equivalent through three lightness bands: light tints
          (&gt;70% L) become dark fills (~13% L) of the same hue; mid borders
          stay vibrant with a small lightness lift; deep texts become pastel
          equivalents (~86% L). Hue is preserved across both modes — that's what
          keeps each notation visually identifiable regardless of theme.
        </p>

        <ChromePaletteCard />

        <div style={{height:24}}/>

        <NodeComparisonCard />

        <div style={{height:24}}/>

        <DarkPaletteAtlas />

        <div className="note" style={{marginTop:24}}>
          <strong>Implementation:</strong> the diagram renderer reads <code>theme</code> from
          the host's preference (system or user toggle), applies a single
          <code>data-theme="dark"</code> attribute to the root, and remaps both
          chrome and semantic colors via attribute selectors — no JSX changes,
          no recompilation, no parallel asset paths. Border, fill, and text are
          derived from the same hue family so contrast ratios stay matched
          (AA on fill, AAA on chrome).
        </div>
        <div className="note" style={{marginTop:12}}>
          <strong>Token rule:</strong> dark-mode remapping is keyed on the light hex, so
          <strong> two tokens that share a light value must share the dark value</strong>.
          <code>--edge-bold</code> is therefore an alias of <code>--ink-2</code>
          (<code>#5a564e</code> → <code>#a8a49a</code>). If a token ever needs its own dark
          value, give it a distinct light value first.
        </div>
      </section>

      <hr />

      {/* 12 — Watermark */}
      <section className="section">
        <div className="section-label">12</div>
        <h2 className="section-title">Diagram Watermark</h2>
        <p className="section-body">
          A small Vithanco watermark is rendered into every diagram export.
          It's a square lockup — the V mark on top, "vithanco" as a real
          <code> &lt;text&gt;</code> element below in DM Sans 700.
          Placement is computed: the renderer measures node bounding boxes and
          drops the watermark into the corner with the least overlap, sized to
          at most 15% of the smaller canvas dimension. On canvases narrower than
          400px the wordmark would render below legibility, so the renderer
          switches to a mark-only variant.
        </p>
        <WatermarkSpec />
      </section>

      <hr />

      {/* 13 — Details Marker */}
      <section className="section">
        <div className="section-label">13</div>
        <h2 className="section-title">Details Marker</h2>
        <p className="section-body">
          Folded, a detailed node is the node it was and draws exactly as its type,
          so the diagram alone cannot show there is more inside. The editor adds a
          count chip in the folded-group badge's language: how many details
          unfolding reveals. Exports stay a plain picture of the model.
        </p>
        <DetailsMarkerSpec />
      </section>

      <hr />

      {/* 14 — Icons */}
      <section className="section">
        <div className="section-label">14</div>
        <h2 className="section-title">Icons</h2>
        <p className="section-body">
          Every icon VGraph ships is drawn for the project, never traced from another icon set, and
          is drawn here first: <code>ICONS</code> in this page is the master, the renderer's
          <code>BuiltinIcons</code> is the copy, and a test fails when the two differ.
        </p>
        <IconsSpec />
      </section>

    </div>
    </ThemeContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
