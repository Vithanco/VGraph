// ─── Themes ──────────────────────────────────────────────────────────────────

const THEMES = {

// ─── Geometry helpers ────────────────────────────────────────────────────────

function boundaryPt(node, tx, ty) {
  const cx = node.x + node.w / 2, cy = node.y + node.h / 2;
  const dx = tx - cx, dy = ty - cy;
  if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) return [cx, cy];
  const hw = node.w / 2 + 5, hh = node.h / 2 + 5;
  const t = Math.min(
    Math.abs(dx) > 0.01 ? hw / Math.abs(dx) : Infinity,
    Math.abs(dy) > 0.01 ? hh / Math.abs(dy) : Infinity,
  );
  return [cx + dx * t, cy + dy * t];
}

function edgePts(fromN, toN) {
  const fcx = fromN.x + fromN.w / 2, fcy = fromN.y + fromN.h / 2;
  const tcx = toN.x + toN.w / 2,     tcy = toN.y + toN.h / 2;
  const [x1, y1] = boundaryPt(fromN, tcx, tcy);
  const [x2, y2] = boundaryPt(toN,   fcx, fcy);
  return { x1, y1, x2, y2, mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
}

// ─── SVG primitives ──────────────────────────────────────────────────────────

function Marker({ id, color }) {
  return (
    <marker id={id} markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0.5 L5.5,3.5 L0,6.5 Z" fill={color} />
    </marker>
  );
}

function DiagramSVG({ nodes, edges, theme, width, height, ibis }) {
  const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));
  const pid = `${theme.key}${ibis ? 'i' : 'c'}`;
  const markerId  = `arr-${pid}`;
  const shadowId  = `shd-${pid}`;
  const glowId    = `glw-${pid}`;

  return (
    <svg width={width} height={height} style={{ display: 'block', background: theme.bg }}>
      <defs>
        <Marker id={markerId} color={theme.edgeStroke} />
        {theme.hasShadow && (
          <filter id={shadowId} x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0" dy="2" stdDeviation="4"
              floodColor={theme.key === 'verdant' ? '#1a9e94' : '#000'}
              floodOpacity={theme.key === 'verdant' ? 0.12 : 0.07} />
          </filter>
        )}
        {theme.hasGlow && (
          <filter id={glowId} x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        )}
      </defs>

      {/* Edges first (behind nodes) */}
      {edges.map((edge, i) => {
        const fn = nodeMap[edge.from], tn = nodeMap[edge.to];
        if (!fn || !tn) return null;
        const { x1, y1, x2, y2 } = edgePts(fn, tn);
        let pathD, lx, ly;
        if (edge.cp) {
          const cpx = (x1 + x2) / 2 + edge.cp[0];
          const cpy = (y1 + y2) / 2 + edge.cp[1];
          pathD = `M${x1},${y1} Q${cpx},${cpy} ${x2},${y2}`;
          lx = 0.25 * x1 + 0.5 * cpx + 0.25 * x2;
          ly = 0.25 * y1 + 0.5 * cpy + 0.25 * y2 - 6;
        } else {
          pathD = `M${x1},${y1} L${x2},${y2}`;
          lx = (x1 + x2) / 2; ly = (y1 + y2) / 2 - 6;
        }
        return (
          <g key={i}>
            <path d={pathD} fill="none"
              stroke={theme.edgeStroke}
              strokeWidth={theme.edgeW}
              strokeOpacity={theme.key === 'blueprint' ? 0.65 : 1}
              markerEnd={`url(#${markerId})`}
            />
            {edge.label && (
              <text x={lx} y={ly} textAnchor="middle"
                fontFamily={theme.nodeFont} fontSize={theme.edgeLabelSize}
                fill={theme.edgeLabelColor} fontStyle="italic"
                style={{ userSelect: 'none' }}>
                {edge.label}
              </text>
            )}
          </g>
        );
      })}

      {/* Nodes */}
      {nodes.map(node => {
        const cx = node.x + node.w / 2, cy = node.y + node.h / 2;
        const lh = theme.nodeFontSize * 1.38;
        const lines = node.label;
        const y0 = cy - ((lines.length - 1) * lh) / 2;

        let fill = theme.nodeFill, border = theme.nodeBorder, textC = theme.nodeText;
        if (ibis && node.type) {
          const c = IBIS_COLORS[theme.key]?.[node.type];
          if (c) { fill = c.fill; border = c.border; textC = c.text; }
        }

        return (
          <g key={node.id}>
            {/* Blueprint: glow ring behind node */}
            {theme.hasGlow && (
              <rect x={node.x} y={node.y} width={node.w} height={node.h}
                rx={theme.nodeRadius} ry={theme.nodeRadius}
                fill="none" stroke={border} strokeWidth={3} strokeOpacity={0.35}
                filter={`url(#${glowId})`}
              />
            )}
            <rect x={node.x} y={node.y} width={node.w} height={node.h}
              rx={theme.nodeRadius} ry={theme.nodeRadius}
              fill={fill} stroke={border} strokeWidth={theme.nodeBorderW}
              filter={theme.hasShadow ? `url(#${shadowId})` : undefined}
            />
            <text textAnchor="middle"
              fontFamily={theme.nodeFont} fontSize={theme.nodeFontSize}
              fontWeight={theme.nodeFontW} fill={textC}
              style={{ userSelect: 'none' }}>
              {lines.map((line, li) => (
                <tspan key={li} x={cx} y={y0 + li * lh}>{line}</tspan>
              ))}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function CRTSwatches({ theme }) {
  return (
    <div style={{ background: theme.bg, padding: 24, display: 'flex', flexDirection: 'column', gap: 10, height: '100%' }}>
      {CRT_TYPES.map(t => {
        const c = t[theme.key] || {};
        return (
          <div key={t.label} style={{
            background: c.fill,
            border: `${theme.nodeBorderW}px solid ${c.border}`,
            borderRadius: theme.nodeRadius,
            padding: '9px 14px',
            fontFamily: theme.nodeFont,
            fontSize: theme.nodeFontSize,
            fontWeight: theme.nodeFontW,
            color: c.text || theme.nodeText,
          }}>
            {t.label}
          </div>
        );
      })}
    </div>
  );
}

// ─── Causal Loop ─────────────────────────────────────────────────────────────

function CausalLoop({ theme }) {
  const w = 380, h = 220;
  const nodes = [
    { id: 'ba', label: ['Bank', 'Account'], cx: 95, cy: 110, r: 60 },
    { id: 'ei', label: ['Earned', 'Interest'], cx: 285, cy: 110, r: 60 },
  ];

  // arc from Bank Account top-right to Earned Interest top-left (above)
  // arc from Earned Interest bottom-left to Bank Account bottom-right (below)

  const arcPath1 = `M 140,75 Q 190,28 240,75`;   // top arc BA→EI
  const arcPath2 = `M 240,145 Q 190,192 140,145`; // bottom arc EI→BA

  // reinforce arrow for center
  const arrColor = theme.edgeStroke;
  const markerId = `arr-cl-${theme.key}`;

  return (
    <svg width={w} height={h} style={{ display: 'block', background: theme.bg }}>
      <defs>
        <Marker id={markerId} color={arrColor} />
      </defs>
      {/* Arcs */}
      <path d={arcPath1} fill="none" stroke={theme.edgeStroke} strokeWidth={theme.edgeW}
        strokeOpacity={theme.key === 'blueprint' ? 0.7 : 1}
        markerEnd={`url(#${markerId})`} />
      <path d={arcPath2} fill="none" stroke={theme.edgeStroke} strokeWidth={theme.edgeW}
        strokeOpacity={theme.key === 'blueprint' ? 0.7 : 1}
        markerEnd={`url(#${markerId})`} />
      {/* "s" labels */}
      {[
        { x: 168, y: 44 }, { x: 212, y: 44 },
        { x: 168, y: 178 }, { x: 212, y: 178 },
      ].map((pt, i) => (
        <text key={i} x={pt.x} y={pt.y} textAnchor="middle"
          fontFamily={theme.nodeFont} fontSize={11} fill={theme.edgeLabelColor}
          fontStyle="italic">s</text>
      ))}
      {/* Reinforcing symbol */}
      <circle cx={190} cy={110} r={22}
        fill={theme.nodeFill} stroke={theme.nodeBorder} strokeWidth={theme.nodeBorderW} />
      <text x={190} y={115} textAnchor="middle"
        fontFamily={theme.nodeFont} fontSize={14} fontWeight="600" fill={theme.nodeText}>R</text>
      {/* Nodes */}
      {nodes.map(n => (
        <g key={n.id}>
          <circle cx={n.cx} cy={n.cy} r={n.r}
            fill={theme.nodeFill} stroke={theme.nodeBorder} strokeWidth={theme.nodeBorderW} />
          <text textAnchor="middle"
            fontFamily={theme.nodeFont} fontSize={theme.nodeFontSize - 0.5}
            fontWeight={theme.nodeFontW} fill={theme.nodeText}>
            {n.label.map((line, li) => (
              <tspan key={li} x={n.cx} y={n.cy + (li - (n.label.length - 1) / 2) * (theme.nodeFontSize * 1.38)}>{line}</tspan>
            ))}
          </text>
        </g>
      ))}
    </svg>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────

    <DesignCanvas>

          <DCArtboard key={theme.key}
            label={`${theme.name}  ·  ${theme.sub}`}
            width={510} height={630}>
            <DiagramSVG nodes={CM_NODES} edges={CM_EDGES}
              theme={theme} width={510} height={630} />

        ))}

      <DCSection title="IBIS Argument Map" subtitle="Semantic node coloring by role">
        {themeList.map(theme => (
          <DCArtboard key={theme.key} label={theme.name} width={390} height={380}>
            <DiagramSVG nodes={IBIS_NODES} edges={IBIS_EDGES}
              theme={theme} width={390} height={380} ibis />
          </DCArtboard>
        ))}
      </DCSection>

      <DCSection title="Causal Loop" subtitle="System dynamics — reinforcing loop">
        {themeList.map(theme => (
          <DCArtboard key={theme.key} label={theme.name} width={380} height={220}>
            <CausalLoop theme={theme} />
          </DCArtboard>
        ))}
      </DCSection>

      <DCSection title="CRT Node Types" subtitle="Cause & effect tree — node type palette">
        {themeList.map(theme => (
          <DCArtboard key={theme.key} label={theme.name} width={280} height={270}>
            <CRTSwatches theme={theme} />
          </DCArtboard>
        ))}

}
