# Explicit labels stop Dependabot creating one label per ecosystem.
version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/VGraphWasm/Tests-JS"
      - "/VGraphWasm/Tests-Browser"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
